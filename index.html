<script>
(()=>{
'use strict';
/* ===== constantes ===== */
const HL=640, GROUND_H=92, GT=HL-GROUND_H;
const GRAV=1450, FLAP=385, VMAX=600, GAP=154, PIPE_W=58, SPACING=212;
const TAU=Math.PI*2, rnd=Math.random;
const FONT='"Avenir Next Condensed", Impact, "Arial Narrow", sans-serif';
const CREAM='#F3D9B1', GOLD='#F2A93B', NAVY='#13245A', OUT='#22140F', INK='#14183F';
const PAL=[
 ['#C8552B','#DD7440','#9B3B1D'],['#D9672E','#EE8A47','#A84620'],['#E8883A','#F4AE5A','#B9621F'],
 ['#E8A83E','#F6CB6E','#B97E24'],['#F0CF9A','#FBE6BF','#C9A070'],['#B94A25','#D56A3A','#8A3219']];
const PAL_PICK=[0,0,1,1,2,2,3,4,5];
const GREENS=['#2F7A3A','#4E9A3E','#7DBF4A'];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeOutBack=t=>{const c=1.70158;t=clamp(t,0,1);return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
function hash(n){n=n|0;n=(n^61)^(n>>>16);n=(n+(n<<3))|0;n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return n>>>0;}

/* ===== canvas e tamanho ===== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
const probe=document.getElementById('probe');
let W=300, scale=1, dpr=1, safeT=0, safeB=0;
function resize(){
  const iw=window.innerWidth, ih=window.innerHeight;
  const cssH=ih, cssW=Math.min(iw,Math.round(ih*0.62));
  dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=cssW+'px'; cv.style.height=cssH+'px'; cv.style.left=((iw-cssW)/2)+'px';
  try{const u=document.getElementById('ui');u.style.left=((iw-cssW)/2)+'px';u.style.width=cssW+'px';}catch(e){}
  cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
  scale=cssH/HL; W=cssW/scale;
  try{const cs=getComputedStyle(probe);safeT=(parseFloat(cs.paddingTop)||0)/scale;safeB=(parseFloat(cs.paddingBottom)||0)/scale;}catch(e){}

}

/* ===== salvamento (sempre em try/catch) ===== */
let bestMem=0, sndOn=true;
try{const b=localStorage.getItem('vdl_best');if(b!==null)bestMem=parseInt(b,10)||0;if(localStorage.getItem('vdl_snd')==='0')sndOn=false;}catch(e){}

/* ===== áudio: sons alienígenas + reggae/dub (Web Audio, liberado no primeiro toque) ===== */
let ac=null, master=null, sfxBus=null, musBus=null, delayN=null;
function initAudio(){
  try{
    if(!ac){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
      ac=new AC(); master=ac.createGain(); master.gain.value=0.6; master.connect(ac.destination);
      sfxBus=ac.createGain(); sfxBus.gain.value=0.9; sfxBus.connect(master);
      musBus=ac.createGain(); musBus.gain.value=0.45; musBus.connect(master);
      delayN=ac.createDelay(1.0); delayN.delayTime.value=0.385;
      const fb=ac.createGain(); fb.gain.value=0.38; const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1700;
      delayN.connect(lp); lp.connect(fb); fb.connect(delayN); lp.connect(master);
      const b=ac.createBuffer(1,1,22050), s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0);
    }
    if(ac.state!=='running')ac.resume();
  }catch(e){}
}
function voice(o){
  if(!ac||!sndOn)return;
  try{
    const t=o.abs!==undefined?o.abs:ac.currentTime+(o.at||0), d=o.dur, os=ac.createOscillator(), g=ac.createGain();
    os.type=o.type||'sine'; os.frequency.setValueAtTime(o.f1,t);
    if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+d);
    if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=o.vibRate||6;lg.gain.value=o.vib;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+d+0.05);}
    if(o.fm){const m=ac.createOscillator(),mg=ac.createGain();m.frequency.value=o.f1*o.fm.ratio;mg.gain.value=o.fm.depth;m.connect(mg);mg.connect(os.frequency);m.start(t);m.stop(t+d+0.05);}
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(o.vol,t+(o.atk||0.01));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    os.connect(g);g.connect(o.bus||sfxBus);
    if(o.send){const s=ac.createGain();s.gain.value=o.send;g.connect(s);s.connect(delayN);}
    os.start(t);os.stop(t+d+0.05);
  }catch(e){}
}
function noiseBurst(o){
  if(!ac||!sndOn)return;
  try{
    const t=o.abs!==undefined?o.abs:ac.currentTime+(o.at||0), n=Math.floor(ac.sampleRate*o.dur), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
    s.buffer=b;f.type=o.ft||'lowpass';f.frequency.value=o.freq||1200;g.gain.value=o.vol;
    s.connect(f);f.connect(g);g.connect(o.bus||sfxBus);
    if(o.send){const sg=ac.createGain();sg.gain.value=o.send;g.connect(sg);sg.connect(delayN);}
    s.start(t);
  }catch(e){}
}
const sfx={
  flap(){voice({type:'sine',f1:260,f2:780,dur:0.14,vol:0.3,vib:45,vibRate:30});voice({type:'triangle',f1:1100,f2:1600,dur:0.06,vol:0.06,at:0.02});},
  point(){voice({type:'sine',f1:1480,f2:1150,dur:0.24,vol:0.22,send:0.4});voice({type:'sine',f1:740,f2:700,dur:0.2,vol:0.1,fm:{ratio:2,depth:260},at:0.02});},
  hit(){voice({type:'sawtooth',f1:720,f2:45,dur:0.6,vol:0.28,vib:70,vibRate:20});noiseBurst({dur:0.35,vol:0.5,ft:'lowpass',freq:900});voice({type:'sine',f1:95,f2:38,dur:0.5,vol:0.55,send:0.3});},
  lm(){[440,554,659,880].forEach((f,i)=>voice({type:'sine',f1:f,f2:f*1.02,dur:0.34,vol:0.2,vib:7,vibRate:7,at:i*0.12,send:0.4}));},
  ui(){voice({type:'sine',f1:660,f2:880,dur:0.09,vol:0.2});},
  applause(){
    if(!ac||!sndOn)return;
    try{
      const sr=ac.sampleRate, D=5.2, n=Math.floor(sr*D), buf=ac.createBuffer(2,n,sr);
      const dens=t=>t<0.6?6+74*(t/0.6):t<3.1?80:80*Math.max(0,1-(t-3.1)/2.0)+2;
      for(let ch=0;ch<2;ch++){
        const d=buf.getChannelData(ch);
        let t=0;
        const clap=(t0,amp)=>{
          const fc=1300+Math.random()*2700, Q=1.2+Math.random()*1.4, w=2*Math.PI*fc/sr, al=Math.sin(w)/(2*Q), a0=1+al;
          const b0=al/a0, b2=-al/a0, a1=-2*Math.cos(w)/a0, a2=(1-al)/a0;
          const len=Math.floor(sr*(0.018+Math.random()*0.022)), tau=sr*0.004*(0.7+Math.random()*0.9), st=Math.floor(t0*sr);
          let x1=0,x2=0,y1=0,y2=0;
          for(let i=0;i<len&&st+i<n;i++){
            const x=(Math.random()*2-1)*Math.exp(-i/tau), y=b0*x+b2*x2-a1*y1-a2*y2;
            x2=x1;x1=x;y2=y1;y1=y;
            d[st+i]+=amp*(y*2.4+x*0.25);
          }
        };
        while(t<D){
          t+=-Math.log(1-Math.random())/dens(t);
          if(t>=D)break;
          const amp=0.2+0.8*Math.random()*Math.random();
          clap(t,amp);
          if(Math.random()<0.3)clap(t+0.006+Math.random()*0.012,amp*0.6);
        }
      }
      let pk=0;for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<n;i++){const a=Math.abs(d[i]);if(a>pk)pk=a;}}
      const k=0.9/(pk||1);
      for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<n;i++){const t=i/sr;d[i]*=k*Math.min(1,t/0.12)*Math.min(1,(D-t)/0.6);}}
      const src=ac.createBufferSource(), g=ac.createGain(), sg=ac.createGain();
      src.buffer=buf;g.gain.value=0.85;sg.gain.value=0.1;
      src.connect(g);g.connect(sfxBus);g.connect(sg);sg.connect(delayN);
      src.start(ac.currentTime+0.03);
      voice({at:0.9,type:'triangle',f1:560,f2:900,dur:0.55,vol:0.035,vib:14,vibRate:7,atk:0.08});
      voice({at:1.5,type:'triangle',f1:680,f2:1050,dur:0.5,vol:0.03,vib:12,vibRate:7,atk:0.06});
      voice({at:1.2,type:'sine',f1:2300,f2:2900,dur:0.7,vol:0.022,vib:60,vibRate:9,atk:0.1});
    }catch(e){}
  }
};
/* trilha reggae animada e zen: one drop, skank leve, baixo redondo, marimba pentatônica e pad suave */
let STEP=60/86/4;
function setTempo(b){STEP=60/b/4;}
const NOTE={C3:130.81,D3:146.83,A2:110,F2:87.31,G2:98,B2:123.47};
const BARS=[ // 8 compassos: C, Am, F, G, C, Am, Dm, G
  {r:NOTE.C3,ch:[261.63,329.63,392,493.88]},{r:NOTE.A2,ch:[220,261.63,329.63,392]},
  {r:NOTE.F2,ch:[220,261.63,349.23,440]},{r:NOTE.G2,ch:[196,246.94,293.66,392]},
  {r:NOTE.C3,ch:[261.63,329.63,392,493.88]},{r:NOTE.A2,ch:[220,261.63,329.63,392]},
  {r:NOTE.D3,ch:[220,261.63,293.66,349.23]},{r:NOTE.G2,ch:[196,246.94,293.66,392]}];
const PENT=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,784];
const MOTIFS=[
  [[2,4,2],[6,3,1],[8,2,2],[12,3,2]],
  [[0,5,2],[3,4,1],[6,3,2],[10,2,2],[14,1,1]],
  [[2,3,1],[4,4,1],[6,5,2],[10,4,2],[13,3,1]],
  [[4,6,2],[8,5,2],[11,4,1],[12,3,3]],
  []];
const PHRASE=[0,1,0,4,2,3,1,4];
let musOn=false, nextT=0, stepIdx=0, musTimer=null;
function musicNote(step,t){
  const bi=Math.floor(step/16)%8, s=step%16, B=BARS[bi];
  // one drop: bumbo + aro no terceiro tempo
  if(s===8){voice({abs:t,type:'sine',f1:125,f2:48,dur:0.22,vol:0.7,bus:musBus,atk:0.004});noiseBurst({abs:t,dur:0.05,vol:0.13,ft:'bandpass',freq:2200,bus:musBus});voice({abs:t,type:'triangle',f1:900,f2:640,dur:0.06,vol:0.07,bus:musBus});}
  if(s%2===0)noiseBurst({abs:t,dur:0.03,vol:(s%4===2)?0.05:0.027,ft:'highpass',freq:8000,bus:musBus});
  // skank macio nos contratempos
  if(s===2||s===6||s===10||s===14)B.ch.forEach(f=>voice({abs:t,type:'triangle',f1:f,dur:0.11,vol:0.028,bus:musBus,atk:0.006,send:0.14}));
  // baixo redondo
  const bn={0:[1,2.6],3:[2,0.8],6:[1.5,2],10:[1,2],13:[1.5,1.6]}[s];
  if(bn){voice({abs:t,type:'sine',f1:B.r*bn[0],dur:bn[1]*STEP*0.95,vol:0.5,bus:musBus,atk:0.012});voice({abs:t,type:'triangle',f1:B.r*bn[0]*2,dur:bn[1]*STEP*0.55,vol:0.06,bus:musBus});}
  // pad suave no início de cada compasso
  if(s===0)B.ch.forEach(f=>voice({abs:t,type:'sine',f1:f/2,dur:16*STEP*0.98,vol:0.02,bus:musBus,atk:0.5}));
  // melodia de marimba (pentatônica), com pausas para respirar
  const m=MOTIFS[PHRASE[bi]];
  for(const n of m){if(n[0]===s){const f=PENT[n[1]];voice({abs:t,type:'sine',f1:f,dur:0.45+n[2]*STEP*0.5,vol:0.1,bus:musBus,atk:0.004,send:0.3});voice({abs:t,type:'triangle',f1:f*2,dur:0.16,vol:0.03,bus:musBus,atk:0.003});}}
}
function musicTick(){
  if(!ac||!musOn||!sndOn)return;
  while(nextT<ac.currentTime+0.15){musicNote(stepIdx,nextT);nextT+=STEP;stepIdx++;}
}
function startMusic(){
  if(!ac||musOn||!sndOn)return; musOn=true;
  try{musBus.gain.cancelScheduledValues(ac.currentTime);musBus.gain.setTargetAtTime(0.45,ac.currentTime,0.02);}catch(e){}
  nextT=ac.currentTime+0.08;stepIdx=0;musTimer=setInterval(musicTick,25);
}
function stopMusic(){
  musOn=false;if(musTimer){clearInterval(musTimer);musTimer=null;}
  try{if(musBus){musBus.gain.cancelScheduledValues(ac.currentTime);musBus.gain.setTargetAtTime(0,ac.currentTime,0.08);}}catch(e){}
}

/* ===== estado do jogo ===== */
const G={state:'ready',paused:false,t:0,score:0,newBest:false,camX:0,pipes:[],lastGy:320,
  ship:{x:90,y:320,vy:0,rot:0,flap:0},lms:[],nextLm:1,parts:[],clouds:[],shake:0,flash:0,
  scorePop:0,banner:null,overT:0,deadT:0,landed:false,btn:null,tail:0,tod:0.10,pipeIdx:0,rank:false,rankT:0,rkScroll:0,rkMax:0,rdrag:null,tok:'',askName:false,asked:false,rkBtn:null};

/* ===== helpers de desenho ===== */
function slabPath(x,y,w,h,c){c=c||2;ctx.beginPath();ctx.moveTo(x+c,y);ctx.lineTo(x+w-c,y);ctx.lineTo(x+w,y+c);ctx.lineTo(x+w,y+h-c);ctx.lineTo(x+w-c,y+h);ctx.lineTo(x+c,y+h);ctx.lineTo(x,y+h-c);ctx.lineTo(x,y+c);ctx.closePath();}
function drawSlab(x,y,w,h,pal,hs){
  slabPath(x,y,w,h); ctx.fillStyle=pal[0]; ctx.fill();
  ctx.fillStyle=pal[1]; ctx.fillRect(x+2,y+1.2,w-4,Math.min(4,h*0.22));
  const sw=Math.min(10,w*0.22); ctx.fillStyle=pal[2]; ctx.fillRect(x+w-sw,y+3.5,sw-1,h-5);
  if(h>=14&&(hs&1)){
    const cx=x+w*0.3+((hs>>>4)%12);
    ctx.beginPath();ctx.moveTo(cx,y+h*0.22);ctx.lineTo(cx+3,y+h*0.48);ctx.lineTo(cx-1.5,y+h*0.7);ctx.lineTo(cx+2,y+h-2);
    ctx.lineWidth=1.1;ctx.strokeStyle='rgba(34,20,15,.55)';ctx.stroke();
  }
  slabPath(x,y,w,h); ctx.lineWidth=2.2; ctx.strokeStyle=OUT; ctx.lineJoin='round'; ctx.stroke();
}
function drawTuft(x,y,s,dir,seed){
  const n=3+(seed%3);
  for(let i=0;i<n;i++){
    const hh=hash(seed*17+i), ang=(i-(n-1)/2)*0.45+((hh%100)/100-0.5)*0.25;
    const len=(9+(hh%7))*s, bw=3.2*s, tx=x+Math.sin(ang)*len, ty=y+dir*Math.cos(ang)*len;
    ctx.beginPath();ctx.moveTo(x-bw,y);
    ctx.quadraticCurveTo(x-bw*0.3+(tx-x)*0.35,y+dir*len*0.6,tx,ty);
    ctx.quadraticCurveTo(x+bw*0.3+(tx-x)*0.35,y+dir*len*0.55,x+bw,y);ctx.closePath();
    ctx.fillStyle=GREENS[(hh>>>3)%3];ctx.fill();ctx.lineWidth=1.3;ctx.strokeStyle='#14301C';ctx.stroke();
  }
}
function pick(hs){return PAL[PAL_PICK[(hs>>>9)%PAL_PICK.length]];}
function drawColumn(p,upper){
  const x=p.x-PIPE_W/2, edge=upper?p.gy-GAP/2:p.gy+GAP/2, limit=(upper?edge:HL-edge)+30;
  let off=0,k=0;
  while(off<limit){
    const hs=hash(p.seed*131+k*7+(upper?3:0)), h=k===0?20:16+(hs%9), ex=k===0?5:((hs>>>5)%5)-2;
    const y=upper?edge-off-h:edge+off;
    drawSlab(x-ex,y,PIPE_W+2*ex,h,pick(hs),hs); off+=h-1.1; k++;
  }
  if(!upper){for(let i=0;i<5;i++)drawTuft(x+7+i*11+(hash(p.seed+i)%4),edge+1,1+(i%2)*0.15,-1,p.seed+i*5);
    if(p.seed%3!==1)mushCluster(x+10+(p.seed%3)*14,edge+2,p.seed);}
  else{for(let i=0;i<3;i++)drawTuft(x+12+i*17,edge-1,0.75,1,p.seed+i*9);}
}
function drawPipes(){for(const p of G.pipes){if(p.x>-PIPE_W&&p.x<W+PIPE_W){drawColumn(p,true);drawColumn(p,false);}}}

/* ===== chão em movimento ===== */
const GP=360, GSLABS=[], GTUFTS=[];
(function(){
  const rows=[[0,26,28,50],[25,30,38,62],[54,50,48,78]];

function addP(o){if(G.parts.length<260)G.parts.push(o);}
function updateParts(dt){
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i];if(p.delay>0){p.delay-=dt;continue;}p.life-=dt;if(p.life<=0){G.parts.splice(i,1);continue;}
    p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=(p.vr||0)*dt;

}
function drawParts(){

    else{ctx.globalAlpha=Math.min(1,a*2);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);ctx.lineWidth=1;ctx.strokeStyle=OUT;ctx.strokeRect(-p.s/2,-p.s/2,p.s,p.s);ctx.restore();}
  }
  ctx.globalAlpha=1;
}

/* ===== lógica ===== */
function curSpeed(){return 122+168*(1-Math.exp(-G.score/45));}
function spacingNow(){return SPACING+clamp((curSpeed()-122)*0.8,0,100);}
function spawnPipe(x){
  G.pipeIdx++;
  const k=G.pipeIdx%10, low=G.pipeIdx>=10&&k<=2; // os 3 gaps depois de cada atração ficam embaixo, para a faixa do título não cobrir a nave
  const minC=low?338:GAP/2+40, maxC=GT-GAP/2-36;
  const gy=clamp(G.lastGy+(rnd()*2-1)*(low?100:150),minC,maxC); G.lastGy=gy;
  G.pipes.push({x,gy,seed:(rnd()*1e6)|0,passed:false});
}
function resetGame(){
  hideAsk();G.state='ready';G.score=0;G.tod=TOD0;G.pipeIdx=0;G.asked=false;G.rank=false;G.newBest=false;G.pipes=[];G.lastGy=300;G.landed=false;G.banner=null;G.btn=null;G.overT=0;G.deadT=0;G.egg=null;

}
function startGame(){

}
function flap(){const s=G.ship;s.vy=-FLAP;s.flap=1;flapFx();sfx.flap();}
function die(kind){
  G.state='dead';G.deadT=0;G.landed=false;G.ship.vy=kind==='pipe'?-140:0;
  G.shake=11;G.flash=1;stopMusic();sfx.hit();
  try{if(navigator.vibrate)navigator.vibrate(35);}catch(e){}
  chips(G.ship.x,G.ship.y,16);

const CIRC=[[-14,2,7],[0,2,8],[14,2,7],[0,-8,7]];
function cr(cx,cy,r,rx,ry,rw,rh){const nx=clamp(cx,rx,rx+rw),ny=clamp(cy,ry,ry+rh),dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r;}
function hitsPipe(p){
  const s=G.ship,l=p.x-PIPE_W/2,gt=p.gy-GAP/2,gb=p.gy+GAP/2;
  if(s.x+30<l-6||s.x-30>l+PIPE_W+6)return false;
  for(const c of CIRC){
    const cx=s.x+c[0],cy=s.y+c[1];
    if(cr(cx,cy,c[2],l,-80,PIPE_W,gt+80)||cr(cx,cy,c[2],l,gb,PIPE_W,HL)||
       cr(cx,cy,c[2],l-5,gt-20,PIPE_W+10,20)||cr(cx,cy,c[2],l-5,gb,PIPE_W+10,20))return true;
  }
  return false;
}
function playStep(dt){
  const sp=curSpeed(), n=Math.max(1,Math.ceil(dt/0.008)), sub=dt/n, s=G.ship;
  for(let i=0;i<n;i++){
    s.vy=Math.min(VMAX,s.vy+GRAV*sub);s.y+=s.vy*sub;
    if(s.y<12){s.y=12;if(s.vy<0)s.vy=0;}
    if(s.y+11>=GT){s.y=GT-11;die('ground');return;}
    for(const p of G.pipes){
      p.x-=sp*sub;
      if(hitsPipe(p)){die('pipe');return;}
      if(!p.passed&&p.x+PIPE_W/2<s.x-6){p.passed=true;G.score++;G.scorePop=1;sfx.point();if(G.score%10===0)spawnLandmark();if(G.score%13===5&&!G.egg)G.egg={x:W+30};}
    }
  }
  while(G.pipes.length&&G.pipes[0].x<-PIPE_W-20)G.pipes.shift();
  const last=G.pipes[G.pipes.length-1];
  const spc=spacingNow();if(last&&last.x+spc<=W+40)spawnPipe(last.x+spc);
  G.camX+=sp*dt;
  setTempo(86+(sp-122)*0.12);
  const pt=G.tod;G.tod+=dt/CYCLE;if(G.tod>=1)G.tod-=1;
  if(pt<0.5&&G.tod>=0.5){sfx.applause();for(let i=0;i<18;i++)addP({type:'emoji',x:20+rnd()*(W-40),y:GT-30-rnd()*20,vx:0,vy:-(38+rnd()*40),g:0,delay:rnd()*1.6,life:2.6+rnd()*1.2,max:3.8,s:22+rnd()*12,ph:rnd()*6.28,rot:0});}
  s.rot+=(clamp(s.vy*0.0021,-0.6,1)-s.rot)*(1-Math.exp(-12*dt));
  G.tail-=dt;if(G.tail<=0){G.tail=0.05;addP({type:'spark',x:s.x-22,y:s.y+2,vx:-sp*0.8-rnd()*30,vy:(rnd()-0.5)*30,g:0,life:0.4,max:0.4,s:1.5+rnd(),col:rnd()<.5?'#FFD23F':'#F28A2E',rot:0});}
  moveLandmarks(sp,dt);
  if(G.egg){G.egg.x-=sp*0.55*dt;if(G.egg.x<-50)G.egg=null;}
}
function deadStep(dt){
  const s=G.ship;G.deadT+=dt;
  s.vy=Math.min(VMAX,s.vy+GRAV*dt);s.y+=s.vy*dt;s.rot+=(1.45-s.rot)*(1-Math.exp(-6*dt));
  if(s.y+11>=GT){s.y=GT-11;s.vy=0;if(!G.landed){G.landed=true;G.deadT=Math.max(G.deadT,0);for(let i=0;i<5;i++)addP({type:'puff',x:s.x+(rnd()-0.5)*30,y:GT-2,vx:(rnd()-0.5)*60,vy:-20-rnd()*30,g:0,life:0.6,max:0.6,s:4+rnd()*3,col:CREAM,rot:0});}}
  if((G.landed&&G.deadT>0.5)||G.deadT>2.5){
    G.state='over';G.overT=0;
    if(G.newBest)for(let i=0;i<34;i++){const a=-Math.PI*(0.1+rnd()*0.8),v=120+rnd()*220;addP({type:'chip',x:W/2,y:HL*0.3,vx:Math.cos(a)*v*(rnd()<.5?-1:1),vy:Math.sin(a)*v,g:500,life:1.2+rnd(),max:2,s:3+rnd()*3,col:rnd()<.5?GOLD:CREAM,rot:rnd()*TAU,vr:(rnd()-0.5)*12});}
  }
}
function moveLandmarks(sp,dt){
  for(const l of G.lms){l.x-=sp*0.25*dt;l.age+=dt;l.hl=Math.max(0,l.hl-dt/9);}
  G.lms=G.lms.filter(l=>l.x>-160);
}
function update(dt){
  G.t+=dt;updateClouds(dt);updateParts(dt);
  G.shake*=Math.exp(-9*dt);G.flash=Math.max(0,G.flash-dt*3.2);G.scorePop=Math.max(0,G.scorePop-dt*4);
  if(G.ship.flap>0)G.ship.flap=Math.max(0,G.ship.flap-dt*3);
  if(G.banner){G.banner.t+=dt;if(G.banner.t>2.6)G.banner=null;}
  if(G.rank)G.rankT+=dt;
  switch(G.state){
    case 'ready':{G.camX+=45*dt;const s=G.ship;s.x=W*0.3;s.y=HL*0.5+Math.sin(G.t*3)*5;s.rot=Math.sin(G.t*2.2)*0.06;moveLandmarks(45,dt);break;}
    case 'play':playStep(dt);break;
    case 'dead':deadStep(dt);for(const l of G.lms)l.age+=dt;break;
    case 'over':G.overT+=dt;if(G.newBest&&G.score>0&&!G.asked&&G.overT>0.9){G.asked=true;showAsk();}break;
  }
}

  if(!/^[a-z0-9]{12,32}$/.test(u)){
    try{u=Array.from(crypto.getRandomValues(new Uint8Array(14)),b=>(b%36).toString(36)).join('');}
    catch(e){u='';while(u.length<14)u+=Math.floor(Math.random()*36).toString(36);}
    try{localStorage.setItem('vdl_uid',u);}catch(e){}
  }
  return u;
}
function webCall(q){
  const ctl=typeof AbortController==='function'?new AbortController():null, tm=setTimeout(()=>{if(ctl)ctl.abort();},12000);
  return fetch(RANK_URL+'?'+q+'&id='+LB.uid+'&_='+Date.now(),{signal:ctl?ctl.signal:undefined}).then(r=>r.json()).then(j=>{
    clearTimeout(tm);
    if(!j||!j.ok||!Array.isArray(j.rows))throw new Error('resp');
    LB.rows=j.rows.map((v,i)=>({id:v.me?LB.uid:'o'+i,n:cleanName(v.n)||'ANÔNIMO',s:Math.max(0,Math.floor(Number(v.s)||0))})).filter(r=>isFinite(r.s));
    LB.state='live';const me=LB.rows.find(r=>r.id===LB.uid);if(me)LB.mine=me.s;
  }).catch(e=>{clearTimeout(tm);if(!LB.rows)LB.state='local';throw e;});
}
let tokGame=0;
/* carimbo de início de partida: o servidor assina a hora e depois confere se o tempo jogado fecha com a pontuação */
function getToken(retry){
  if(!LB.web)return;
  if(!retry){tokGame++;G.tok='';}
  const g=tokGame;
  fetch(RANK_URL+'?a=start&id='+LB.uid+'&_='+Date.now()).then(r=>r.json()).then(j=>{
    if(!j||!j.ok||!j.k)throw new Error('tok');
    if(g===tokGame)G.tok=j.k;
  }).catch(()=>{if(!retry)setTimeout(()=>{if(g===tokGame&&!G.tok)getToken(true);},2000);});
}
let lastRefresh=0;
function refreshBoard(){
  if(!LB.web)return;const n=Date.now();if(n-lastRefresh<15000&&LB.rows)return;lastRefresh=n;
  webCall('a=top').catch(()=>{});
}
function initWeb(){
  LB.web=true;LB.uid=uidWeb();LB.can=true;LB.state='loading';
  /* leve: sem atualização periódica; busca uma vez, depois que o jogo já está rodando, e de novo só ao abrir o ranking */
  setTimeout(refreshBoard,4000);
}
async function initBoard(){
  try{
    const c=window.claude;if(!c||!c.use)return;
    const db=await c.use('db'), user=await c.use('user');
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    LB.db=db;LB.uid=uid;
    try{LB.can=await user.can('data.write');}catch(e){}
    LB.state='loading';
    const timer=setTimeout(()=>{if(LB.state==='loading')LB.state='slow';},10000);
    db.collection('ranking').orderBy('s','desc').limit(500).onSnapshot(snap=>{
      clearTimeout(timer);
      const rows=[];
      snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.n==='string'&&typeof v.s==='number'&&isFinite(v.s))rows.push({id:d.id,n:cleanName(v.n)||'ANÔNIMO',s:Math.max(0,Math.floor(v.s))});});
      LB.rows=rows;LB.state='live';
      const me=rows.find(r=>r.id===uid);if(me)LB.mine=me.s;
    },()=>{clearTimeout(timer);LB.state='local';});
  }catch(e){}
}
async function submitScore(raw,score){
  const name=cleanName(raw)||'JOGADOR';lastName=name;
  try{localStorage.setItem(NAME_KEY,name);}catch(e){}
  const ex=localBoard.find(e=>e.n===name);
  if(ex){if(score>ex.s)ex.s=score;}else localBoard.push({n:name,s:score});
  localBoard.sort((a,b)=>b.s-a.s);localBoard=localBoard.slice(0,300);
  try{localStorage.setItem(LB_KEY,JSON.stringify(localBoard));}catch(e){}
  if(LB.web){try{lastRefresh=Date.now();await webCall('a=save&n='+encodeURIComponent(name)+'&s='+Math.floor(score)+(G.tok?'&k='+encodeURIComponent(G.tok):''));}catch(e){}}
  if(LB.db&&LB.uid&&LB.can!==false){
    try{
      const ref=LB.db.doc('ranking/'+LB.uid), cur=await ref.get(), d=cur.exists?cur.data():null;
      const old=d&&typeof d.s==='number'?d.s:0, keep=Math.max(old,score);
      if(!d||d.n!==name||keep!==old)await ref.set({n:name,s:keep,t:Date.now()});
      LB.mine=keep;
    }catch(e){}
  }
}
const uiEl=document.getElementById('ui'), nmEl=document.getElementById('nm'), okEl=document.getElementById('ok'), skEl=document.getElementById('skip'), msgEl=document.getElementById('uiMsg');
function showAsk(){
  G.askName=true;document.getElementById('uiScore').textContent=G.score+' PONTOS';nmEl.value=lastName;
  msgEl.textContent=!LB.db&&!LB.web?'Ranking geral indisponível aqui: o nome fica só neste aparelho.':(LB.can===false?'Seu acesso é só de leitura: o nome fica só neste aparelho.':'');
  uiEl.style.display='flex';
}
function hideAsk(){G.askName=false;try{uiEl.style.display='none';nmEl.blur();}catch(e){}}
let saving=false;
okEl.addEventListener('click',async()=>{
  if(saving)return;saving=true;okEl.disabled=true;
  try{await submitScore(nmEl.value,G.score);}catch(e){}
  saving=false;okEl.disabled=false;hideAsk();G.rank=true;G.rankT=0;G.rkScroll=0;sfx.lm();
});
skEl.addEventListener('click',hideAsk);
nmEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();okEl.click();}});
function drawRankBtn(cx,y,w,h,alpha){
  const x=cx-w/2;G.rkBtn={x,y,w,h};
  ctx.save();ctx.globalAlpha=alpha===undefined?1:alpha;
  rr(x,y+4,w,h,h/2.6);ctx.fillStyle='#0E1B4A';ctx.fill();
  rr(x,y,w,h,h/2.6);ctx.fillStyle=CREAM;ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle='#0E1B4A';ctx.stroke();
  txt('RANKING',cx,y+h/2+h*0.18,fit('RANKING',w-30,h*0.55),NAVY,null,0);
  ctx.restore();
}
function drawRank(){
  const T=G.rankT,k=easeOutBack(T/0.3);
  ctx.save();ctx.globalAlpha=Math.min(1,T*6);ctx.fillStyle='rgba(8,16,50,.72)';ctx.fillRect(0,0,W,HL);
  const live=LB.state==='live'&&LB.rows, rows=live?LB.rows:(LB.state==='loading'?[]:localBoard), rowH=28, n=rows.length;
  const maxCh=HL-safeT-76, nVis=Math.min(n,Math.max(3,Math.floor((maxCh-154)/rowH)));
  const cw=Math.min(W-28,276),cx=W/2,ch=Math.max(250,90+nVis*rowH+64),ct=Math.max(safeT+54,HL*0.5-ch/2-6);
  G.rkMax=Math.max(0,(n-nVis)*rowH);G.rkScroll=Math.max(0,Math.min(G.rkMax,G.rkScroll||0));
  ctx.translate(cx,ct+ch/2);ctx.scale(0.85+0.15*k,0.85+0.15*k);ctx.translate(-cx,-(ct+ch/2));
  rr(cx-cw/2+5,ct+7,cw,ch,18);ctx.fillStyle='rgba(8,16,50,.55)';ctx.fill();
  rr(cx-cw/2,ct,cw,ch,18);ctx.fillStyle='#1A3B94';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#0E1B4A';ctx.stroke();
  rr(cx-cw/2+8,ct+8,cw-16,ch-16,12);ctx.lineWidth=1.5;ctx.strokeStyle='rgba(243,217,177,.45)';ctx.stroke();
  txt('RANKING',cx,ct+54,fit('RANKING',cw-40,46),GOLD,NAVY,7);
  const sub=live?'TODOS OS JOGADORES'+(n?' ('+n+')':''):LB.state==='loading'?'CARREGANDO...':'NESTE APARELHO';
  txt(sub,cx,ct+76,13,CREAM,null,0);
  const y0=ct+90;
  if(!n){
    txt(LB.state==='loading'?'AGUARDE':'NINGUÉM NO RANKING',cx,y0+70,fit('NINGUÉM NO RANKING',cw-40,24),CREAM,null,0);
    if(LB.state!=='loading')txt('SEJA O PRIMEIRO!',cx,y0+100,22,GOLD,null,0);
  }
  ctx.save();ctx.beginPath();ctx.rect(cx-cw/2+10,y0,cw-20,nVis*rowH);ctx.clip();
  const i0=Math.max(0,Math.floor(G.rkScroll/rowH)), i1=Math.min(n,i0+nVis+2);
  for(let i=i0;i<i1;i++){
    const r=rows[i], y=y0+i*rowH-G.rkScroll, mine=live?(r.id===LB.uid):(lastName!==''&&r.n===lastName);
    if(mine){rr(cx-cw/2+12,y,cw-24,rowH-3,8);ctx.fillStyle='rgba(242,169,59,.28)';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=GOLD;ctx.stroke();}
    const medal=['#F2A93B','#D8DCE6','#C8803A'][i];
    ctx.beginPath();ctx.arc(cx-cw/2+32,y+rowH/2-1.5,11,0,TAU);ctx.fillStyle=medal||'#0E1B4A';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#0E1B4A';ctx.stroke();
    txt(String(i+1),cx-cw/2+32,y+rowH/2+4,fit(String(i+1),18,14),medal?NAVY:CREAM,null,0);
    txt(r.n,cx-cw/2+52,y+rowH/2+6,fit(r.n,cw-130,20),CREAM,null,0,'left');
    txt(String(r.s),cx+cw/2-22,y+rowH/2+6,22,GOLD,null,0,'right');
  }
  ctx.restore();
  if(G.rkMax>0){
    const th=Math.max(24,nVis*rowH*nVis/n), ty=y0+(nVis*rowH-th)*(G.rkScroll/G.rkMax);
    rr(cx+cw/2-14,ty,4,th,2);ctx.fillStyle='rgba(243,217,177,.6)';ctx.fill();
    txt('ARRASTE PARA VER MAIS',cx,ct+ch-44,fit('ARRASTE PARA VER MAIS',cw-40,11),GOLD,null,0);
  }
  if(LB.db&&LB.can===false)txt('MODO LEITURA: SÓ COLABORADORES REGISTRAM',cx,ct+ch-58,fit('MODO LEITURA: SÓ COLABORADORES REGISTRAM',cw-30,11),CREAM,null,0);
  ctx.globalAlpha*=0.65+0.35*Math.sin(G.t*4);
  txt('TOQUE PARA VOLTAR',cx,ct+ch-22,fit('TOQUE PARA VOLTAR',cw-40,17),CREAM,null,0);
  ctx.restore();
}

/* ===== render ===== */
function render(){
  SK=skyAt(G.tod);G.rkBtn=null;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  ctx.save();
  if(G.shake>0.3)ctx.translate((rnd()-0.5)*G.shake,(rnd()-0.5)*G.shake);
  drawSky();drawCelestial();drawClouds();
  drawRidge(RIDGE_FAR,0.07,SK.rf);drawRidge(RIDGE_NEAR,0.14,SK.rn);
  drawHouses();drawBushes();drawLandmarks();drawEgg();drawPipes();drawGround();
  drawTint();
  if(G.state==='play'||G.state==='dead')drawBanner();
  const s=G.ship;
  if(SK.dk>0.3&&G.state!=='over'){ctx.globalAlpha=0.11*SK.dk;ctx.fillStyle='#FFE9A8';ctx.beginPath();ctx.arc(s.x,s.y,36,0,TAU);ctx.fill();ctx.globalAlpha=0.07*SK.dk;ctx.beginPath();ctx.arc(s.x,s.y,54,0,TAU);ctx.fill();ctx.globalAlpha=1;}
  drawShip(s.x,s.y,s.rot,G.t,s.flap,G.state!=='dead'&&G.state!=='over');
  drawParts();
  ctx.restore();
  if(G.flash>0.01){ctx.globalAlpha=0.65*G.flash;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,HL);ctx.globalAlpha=1;}
  if(G.state==='ready')drawTitle();
  else if(G.state==='play'||G.state==='dead')drawHUD();
  else if(G.state==='over')drawOver();
  if(G.rank)drawRank();
  if(G.paused)drawPause();
  drawSnd();
}

/* ===== entrada: eventos pointer, uma vez só ===== */
function inRect(x,y,r,pad){return x>=r.x-pad&&x<=r.x+r.w+pad&&y>=r.y-pad&&y<=r.y+r.h+pad;}
function onDown(e){
  const tg=e.target;if(tg&&tg.closest&&tg.closest('#ui'))return;
  if(e.cancelable)e.preventDefault();
  initAudio();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/scale,y=(e.clientY-r.top)/scale;
  if(G.askName)return;
  if(inRect(x,y,sndRect(),8)){sndOn=!sndOn;saveSnd();if(sndOn){sfx.ui();if(G.state==='play'&&!G.paused)startMusic();}else stopMusic();return;}
  if(G.rank){if(G.rankT>0.2)G.rdrag={y:y,s:G.rkScroll||0,moved:false};return;}
  if(G.paused){G.paused=false;last=0;if(G.state==='play')startMusic();return;}
  if(G.state==='ready'){const ch=pilotChips().find(r=>inRect(x,y,r,3));if(ch){pilotIdx=ch.i;savePilot();sfx.ui();return;}}
  if(G.rkBtn&&inRect(x,y,G.rkBtn,6)&&(G.state==='ready'||(G.state==='over'&&G.overT>0.5))){G.rank=true;G.rankT=0;G.rkScroll=0;sfx.ui();refreshBoard();return;}
  switch(G.state){
    case 'ready':startGame();break;
    case 'play':flap();break;
    case 'over':if(G.overT>0.5&&G.btn&&inRect(x,y,G.btn,4))resetGame();break;
  }
}
window.addEventListener('pointerdown',onDown,{passive:false});
window.addEventListener('pointermove',e=>{
  const d=G.rdrag;if(!d)return;
  const y=(e.clientY-cv.getBoundingClientRect().top)/scale;
  if(Math.abs(y-d.y)>6)d.moved=true;
  if(d.moved)G.rkScroll=Math.max(0,Math.min(G.rkMax||0,d.s-(y-d.y)));
},{passive:true});
window.addEventListener('wheel',e=>{if(G.rank){G.rkScroll=Math.max(0,Math.min(G.rkMax||0,(G.rkScroll||0)+e.deltaY*0.5));}},{passive:true});
function endDrag(){const d=G.rdrag;G.rdrag=null;if(d&&!d.moved&&G.rank){G.rank=false;sfx.ui();}}
window.addEventListener('pointerup',()=>{initAudio();endDrag();},{passive:true});
window.addEventListener('pointercancel',()=>{G.rdrag=null;},{passive:true});
window.addEventListener('touchend',initAudio,{passive:true});
const inUI=e=>e.target&&e.target.closest&&e.target.closest('#ui');
document.addEventListener('touchmove',e=>{if(!inUI(e)&&e.cancelable)e.preventDefault();},{passive:false});
['gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart','dragstart'].forEach(n=>document.addEventListener(n,e=>{if(!inUI(e))e.preventDefault();}));
function pauseGame(){if(G.state==='play'){G.paused=true;stopMusic();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});
window.addEventListener('blur',pauseGame);
window.addEventListener('pagehide',pauseGame);
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));

/* ===== laço principal com delta time ===== */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  let dt=(ts-last)/1000;last=ts;
  dt=dt>0.1?1/60:Math.min(dt,0.05);
  if(!G.paused)update(dt);
  render();
}

/* ===== ícone da tela de início (SVG embutido) ===== */
const ICON_SVG='<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180"><rect width="180" height="180" fill="#2B57B2"/><rect width="180" height="46" fill="#264FA6"/><rect y="100" width="180" height="50" fill="#3A6CC2"/><path d="M-4 30Q30 22 70 30Q30 38 -4 30Z" fill="#F3D9B1"/><path d="M20 38Q60 31 100 38Q60 45 20 38Z" fill="#E8883A"/><path d="M110 22Q145 15 186 22Q145 29 110 22Z" fill="#E8883A"/><path d="M125 29Q155 24 190 29Q155 34 125 29Z" fill="#F3D9B1"/><rect y="142" width="180" height="40" fill="#C8552B"/><g stroke="#22140F" stroke-width="3" stroke-linejoin="round"><rect x="-4" y="146" width="62" height="18" fill="#E8883A"/><rect x="57" y="146" width="72" height="18" fill="#D9672E"/><rect x="128" y="146" width="56" height="18" fill="#E8A83E"/><rect x="-4" y="163" width="84" height="22" fill="#B94A25"/><rect x="79" y="163" width="70" height="22" fill="#C8552B"/><rect x="148" y="163" width="36" height="22" fill="#E8883A"/></g><rect y="140" width="180" height="8" fill="#3F8F3A" stroke="#14301C" stroke-width="2.5"/><g fill="#4E9A3E" stroke="#14301C" stroke-width="2"><path d="M8 142L12 126L19 142Z"/><path d="M60 142L66 124L72 142Z"/><path d="M118 142L122 128L130 142Z"/><path d="M160 142L166 125L172 142Z"/></g><g transform="translate(108 80) scale(2.3)" stroke="#14183F" stroke-width="1.6" stroke-linejoin="round"><path d="M-19 -1Q-32 -4-44 -1Q-32 3-19 4Z" fill="#F28A2E"/><path d="M-19 4Q-34 5-50 11Q-34 11-19 9Z" fill="#F28A2E"/><path d="M-19 8Q-30 12-42 19Q-30 17-19 12Z" fill="#F28A2E"/><path d="M-19 4Q-30 4.5-40 7Q-30 8-19 6Z" fill="#FFD23F" stroke="none"/><ellipse cx="0" cy="2" rx="24" ry="8" fill="#2E3A8C"/><ellipse cx="0" cy="9.6" rx="8" ry="2" fill="#F2A93B"/><clipPath id="d"><path d="M-11 .5Q-11 -17 0 -17Q11 -17 11 .5Z"/></clipPath><path d="M-11 .5Q-11 -17 0 -17Q11 -17 11 .5Z" fill="#A8E4F0"/><g clip-path="url(#d)" stroke="none"><circle cx="0" cy="-7.5" r="6.2" fill="#49A83A"/><circle cx="-1.3" cy="-8.3" r="6.2" fill="#6BD04A"/><ellipse cx="-2.7" cy="-8.6" rx="1.7" ry="2.6" transform="rotate(25 -2.7 -8.6)" fill="#16231A"/><ellipse cx="2.7" cy="-8.6" rx="1.7" ry="2.6" transform="rotate(-25 2.7 -8.6)" fill="#16231A"/></g><path d="M-2.6 -5.2Q0 -3.4 2.6 -5.2" fill="none" stroke="#1B3A1B" stroke-width="1.1"/><path d="M-11 .5Q-11 -17 0 -17Q11 -17 11 .5Z" fill="none"/><path d="M-21.5 1.5A21.5 4.5 0 0 0 21.5 1.5Z" fill="#5B6FD0"/><g stroke-width=".9"><circle cx="-15" cy="4.3" r="1.8" fill="#FFD23F"/><circle cx="-7.5" cy="4.8" r="1.8" fill="#C8552B"/><circle cx="0" cy="5.3" r="1.8" fill="#FFD23F"/><circle cx="7.5" cy="4.8" r="1.8" fill="#C8552B"/><circle cx="15" cy="4.3" r="1.8" fill="#FFD23F"/></g></g></svg>';
function setupIcon(){
  try{
    const uri='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(ICON_SVG);
    const l1=document.createElement('link');l1.rel='icon';l1.type='image/svg+xml';l1.href=uri;document.head.appendChild(l1);
    const l2=document.createElement('link');l2.rel='apple-touch-icon';l2.href=uri;document.head.appendChild(l2);
    const img=new Image();
    img.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=180;c.getContext('2d').drawImage(img,0,0,180,180);l2.href=c.toDataURL('image/png');}catch(e){}};
    img.src=uri;
  }catch(e){}
}

/* ===== início ===== */
resize();initClouds();resetGame();setupIcon();
if(RANK_URL)initWeb();else(function waitClaude(n){if(window.claude&&window.claude.use)initBoard();else if(n<20)setTimeout(()=>waitClaude(n+1),250);})(0);

requestAnimationFrame(frame);
})();
